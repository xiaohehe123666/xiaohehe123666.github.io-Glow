<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - GIT Glow信息技术研创社</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        
        .header {
            background: #1e293b;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #3b82f6;
            text-decoration: none;
        }
        
        .nav {
            display: flex;
            gap: 20px;
        }
        
        .nav a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .nav a:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #e2e8f0;
        }
        
        .nav a.active {
            background: #3b82f6;
            color: white;
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 20px;
            transition: background 0.2s;
        }
        
        .user-profile:hover {
            background: rgba(148, 163, 184, 0.1);
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
        }
        
        .user-name {
            font-size: 14px;
            color: #e2e8f0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            padding-bottom: 100px;
        }
        
        .user-center {
            background: #1e293b;
            border-radius: 12px;
            padding: 30px;
        }
        
        .user-header {
            display: flex;
            align-items: center;
            gap: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .user-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3b82f6;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .user-avatar-large:hover {
            transform: scale(1.05);
        }
        
        .user-info h2 {
            color: #e2e8f0;
            margin-bottom: 5px;
        }
        
        .user-info p {
            color: #64748b;
            font-size: 14px;
        }
        
        .user-stats {
            display: flex;
            gap: 40px;
            margin-top: 25px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #3b82f6;
        }
        
        .stat-label {
            font-size: 13px;
            color: #64748b;
            margin-top: 5px;
        }
        
        .user-section {
            margin-top: 30px;
        }
        
        .user-section h3 {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        .profile-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            color: #64748b;
            font-size: 14px;
        }
        
        .detail-value {
            color: #e2e8f0;
            font-size: 14px;
        }
        
        .edit-profile-btn {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        
        .edit-profile-btn:hover {
            background: #2563eb;
        }
        
        .favorites-list, .history-list {
            display: grid;
            gap: 12px;
        }
        
        .list-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .list-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-title {
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .item-category {
            color: #64748b;
            font-size: 12px;
        }
        
        .item-time {
            color: #64748b;
            font-size: 12px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .empty-hint {
            font-size: 13px;
            margin-top: 5px;
            opacity: 0.7;
        }
        
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .setting-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        
        .setting-icon {
            font-size: 18px;
            margin-right: 12px;
        }
        
        .setting-text {
            flex: 1;
            color: #e2e8f0;
            font-size: 14px;
        }
        
        .setting-arrow {
            color: #64748b;
            font-size: 14px;
        }
        
        .logout-btn {
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 15px;
            background: #020617;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid #1e293b;
        }
        
        @media (max-width: 600px) {
            .header {
                padding: 12px 15px;
            }
            
            .nav {
                display: none;
            }
            
            .user-header {
                flex-direction: column;
                text-align: center;
            }
            
            .user-stats {
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .container {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="logo">GIT Glow</a>
        <div class="nav">
            <a href="index.html">首页</a>
            <a href="user-center.html" class="active">用户中心</a>
            <a href="xxx.HTML">关于我们</a>
        </div>
        <div class="user-profile" id="user-profile">
            <img id="user-avatar" src="" alt="头像" class="user-avatar">
            <span id="user-name">登录</span>
        </div>
    </div>
    
    <div class="container">
        <div class="user-center">
            <div class="user-header">
                <img id="large-avatar" src="" alt="头像" class="user-avatar-large" onclick="changeAvatar()">
                <div class="user-info">
                    <h2 id="profile-name">用户</h2>
                    <p id="profile-email">未登录</p>
                    <p id="profile-bio" style="margin-top:10px;color:#94a3b8;font-size:14px;"></p>
                </div>
            </div>
            
            <div class="user-stats">
                <div class="stat-item">
                    <div class="stat-value" id="favorites-count">0</div>
                    <div class="stat-label">收藏案例</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="history-count">0</div>
                    <div class="stat-label">浏览记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="contribution-count">0</div>
                    <div class="stat-label">贡献次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="join-date">--</div>
                    <div class="stat-label">加入时间</div>
                </div>
            </div>
            
            <div class="user-section">
                <h3>个人资料</h3>
                <div class="profile-details">
                    <div class="detail-row">
                        <span class="detail-label">性别</span>
                        <span class="detail-value" id="profile-gender">未设置</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">生日</span>
                        <span class="detail-value" id="profile-birthday">未设置</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">等级</span>
                        <span class="detail-value">Lv.1 新手探索者</span>
                    </div>
                    <button class="edit-profile-btn" onclick="editProfile()">✏️ 编辑资料</button>
                </div>
            </div>
            
            <div class="user-section">
                <h3>我的收藏</h3>
                <div id="favorites-list" class="favorites-list">
                    <div class="empty-state">
                        <div class="empty-icon">⭐</div>
                        <p>暂无收藏内容</p>
                        <p class="empty-hint">浏览案例时点击收藏按钮添加</p>
                    </div>
                </div>
            </div>
            
            <div class="user-section">
                <h3>最近浏览</h3>
                <div id="history-list" class="history-list">
                    <div class="empty-state">
                        <div class="empty-icon">📖</div>
                        <p>暂无浏览记录</p>
                        <p class="empty-hint">浏览案例后会在这里显示</p>
                    </div>
                </div>
            </div>
            
            <div class="user-section">
                <h3>账户设置</h3>
                <div class="settings-list">
                    <div class="setting-item" onclick="changePassword()">
                        <span class="setting-icon">🔐</span>
                        <span class="setting-text">修改密码</span>
                        <span class="setting-arrow">→</span>
                    </div>
                    <div class="setting-item" onclick="showNotificationSettings()">
                        <span class="setting-icon">🔔</span>
                        <span class="setting-text">通知设置</span>
                        <span class="setting-arrow">→</span>
                    </div>
                    <div class="setting-item" onclick="showPrivacySettings()">
                        <span class="setting-icon">🔒</span>
                        <span class="setting-text">隐私设置</span>
                        <span class="setting-arrow">→</span>
                    </div>
                    <div class="setting-item" onclick="showDataExport()">
                        <span class="setting-icon">📤</span>
                        <span class="setting-text">数据导出</span>
                        <span class="setting-arrow">→</span>
                    </div>
                    <div class="setting-item" onclick="openDisclaimer()">
                        <span class="setting-icon">📜</span>
                        <span class="setting-text">免责声明</span>
                        <span class="setting-arrow">→</span>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">🚪 退出登录</button>
            </div>
        </div>
    </div>
    
    <input type="file" id="avatar-upload" accept="image/*" style="display:none;" onchange="uploadAvatar()">
    
    <footer>
        © 2026 GIT Glow信息技术研创社 非盈利学术科普研究团体
    </footer>
    
    <script>
        var defaultAvatar = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2364748b"%3E%3Cpath d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/%3E%3C/svg%3E';
        
        document.addEventListener('DOMContentLoaded', function() {
            initUser();
        });
        
        function initUser() {
            try {
                var currentUser = JSON.parse(localStorage.getItem('gitglow_current_user') || 'null');
                var avatar = document.getElementById('user-avatar');
                var largeAvatar = document.getElementById('large-avatar');
                var userName = document.getElementById('user-name');
                var profileName = document.getElementById('profile-name');
                var profileEmail = document.getElementById('profile-email');
                var profileBio = document.getElementById('profile-bio');
                var profileGender = document.getElementById('profile-gender');
                var profileBirthday = document.getElementById('profile-birthday');
                var joinDate = document.getElementById('join-date');
                
                if(currentUser) {
                    var userAvatar = localStorage.getItem('gitglow_avatar_' + currentUser.id) || defaultAvatar;
                    avatar.src = userAvatar;
                    if(largeAvatar) largeAvatar.src = userAvatar;
                    userName.textContent = currentUser.username;
                    if(profileName) profileName.textContent = currentUser.username;
                    if(profileEmail) profileEmail.textContent = currentUser.email;
                    if(profileBio) profileBio.textContent = currentUser.bio || '暂无简介';
                    
                    var genderText = { 'male': '男', 'female': '女', 'other': '其他' };
                    if(profileGender) profileGender.textContent = genderText[currentUser.gender] || '未设置';
                    
                    if(profileBirthday) {
                        profileBirthday.textContent = currentUser.birthday || '未设置';
                    }
                    
                    if(joinDate) {
                        if(currentUser.createdAt) {
                            var date = new Date(currentUser.createdAt);
                            joinDate.textContent = date.getFullYear() + '-' + 
                                String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                                String(date.getDate()).padStart(2, '0');
                        } else {
                            joinDate.textContent = '--';
                        }
                    }
                    
                    loadFavorites();
                    loadHistory();
                    updateStats();
                } else {
                    avatar.src = defaultAvatar;
                    if(largeAvatar) largeAvatar.src = defaultAvatar;
                    userName.textContent = '登录';
                    if(profileName) profileName.textContent = '用户';
                    if(profileEmail) profileEmail.textContent = '请先登录';
                    if(profileBio) profileBio.textContent = '';
                    
                    document.getElementById('user-profile').onclick = function() {
                        window.location.href = 'auth.html';
                    };
                }
            } catch(e) {
                console.error('initUser error:', e);
            }
        }
        
        function loadFavorites() {
            var currentUser = JSON.parse(localStorage.getItem('gitglow_current_user') || 'null');
            if(!currentUser) return;
            
            var favorites = JSON.parse(localStorage.getItem('gitglow_favorites_' + currentUser.id) || '[]');
            var list = document.getElementById('favorites-list');
            if(!list) return;
            
            if(favorites.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">⭐</div><p>暂无收藏内容</p><p class="empty-hint">浏览案例时点击收藏按钮添加</p></div>';
                return;
            }
            
            var html = '';
            for(var i=0; i<favorites.length; i++) {
                html += '<div class="list-item" onclick="openCase(\'' + favorites[i].title + '\')">' +
                    '<div class="item-info">' +
                    '<div class="item-title">' + favorites[i].title + '</div>' +
                    '<div class="item-category">' + favorites[i].category + '</div>' +
                    '</div>' +
                    '<div class="item-time">' + formatTime(favorites[i].time) + '</div>' +
                    '</div>';
            }
            list.innerHTML = html;
        }
        
        function loadHistory() {
            var currentUser = JSON.parse(localStorage.getItem('gitglow_current_user') || 'null');
            if(!currentUser) return;
            
            var history = JSON.parse(localStorage.getItem('gitglow_history_' + currentUser.id) || '[]');
            var list = document.getElementById('history-list');
            if(!list) return;
            
            if(history.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📖</div><p>暂无浏览记录</p><p class="empty-hint">浏览案例后会在这里显示</p></div>';
                return;
            }
            
            var html = '';
            for(var i=0; i<history.length; i++) {
                html += '<div class="list-item" onclick="openCase(\'' + history[i].title + '\')">' +
                    '<div class="item-info">' +
                    '<div class="item-title">' + history[i].title + '</div>' +
                    '<div class="item-category">' + history[i].category + '</div>' +
                    '</div>' +
                    '<div class="item-time">' + formatTime(history[i].time) + '</div>' +
                    '</div>';
            }
            list.innerHTML = html;
        }
        
        function updateStats() {
            var currentUser = JSON.parse(localStorage.getItem('gitglow_current_user') || 'null');
            if(!currentUser) return;
            
            var favorites = JSON.parse(localStorage.getItem('gitglow_favorites_' + currentUser.id) || '[]');
            var history = JSON.parse(localStorage.getItem('gitglow_history_' + currentUser.id) || '[]');
            
            var favCount = document.getElementById('favorites-count');
            var histCount = document.getElementById('history-count');
            
            if(favCount) favCount.textContent = favorites.length;
            if(histCount) histCount.textContent = history.length;
        }
        
        function formatTime(timeStr) {
            if(!timeStr) return '';
            var now = new Date();
            var time = new Date(timeStr);
            var diff = now - time;
            
            if(diff < 60000) return '刚刚';
            if(diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if(diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if(diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            
            return time.getMonth() + 1 + '月' + time.getDate() + '日';
        }
        
        function editProfile() {
            window.location.href = 'edit-profile.html';
        }
        
        function changeAvatar() {
            document.getElementById('avatar-upload').click();
        }
        
        function uploadAvatar() {
            var file = document.getElementById('avatar-upload').files[0];
            if(file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var currentUser = JSON.parse(localStorage.getItem('gitglow_current_user') || 'null');
                    if(currentUser) {
                        localStorage.setItem('gitglow_avatar_' + currentUser.id, e.target.result);
                        document.getElementById('user-avatar').src = e.target.result;
                        document.getElementById('large-avatar').src = e.target.result;
                    }
                };
                reader.readAsDataURL(file);
            }
        }
        
        function logout() {
            if(confirm('确定要退出登录吗？')) {
                localStorage.removeItem('gitglow_current_user');
                window.location.reload();
            }
        }
        
        function openCase(title) {
            localStorage.setItem('gitglow_selected_case', title);
            window.location.href = 'index.html?case=' + encodeURIComponent(title);
        }
        
        function changePassword() {
            alert('修改密码功能开发中...');
        }
        
        function showNotificationSettings() {
            alert('通知设置功能开发中...');
        }
        
        function showPrivacySettings() {
            alert('隐私设置功能开发中...');
        }
        
        function showDataExport() {
            alert('数据导出功能开发中...');
        }

        function openDisclaimer() {
            window.location.href = 'disclaimer.html';
        }
    </script>
</body>
</html>
