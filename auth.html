<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIT Glow - 注册登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 48px;
            color: #60a5fa;
            margin-bottom: 10px;
        }
        .title {
            font-size: 24px;
            color: #e2e8f0;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #64748b;
        }
        .tabs {
            display: flex;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 5px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
        }
        .tab.active {
            background: #3b82f6;
            color: #fff;
        }
        .tab.inactive {
            color: #94a3b8;
        }
        .tab.inactive:hover {
            color: #e2e8f0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 15px;
            transition: border-color 0.3s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #3b82f6;
        }
        .form-group input::placeholder {
            color: #475569;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
        }
        .checkbox-group label {
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
        }
        .btn-secondary {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.1);
            color: #e2e8f0;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #475569;
            font-size: 13px;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(148, 163, 184, 0.2);
        }
        .divider::before {
            left: 0;
        }
        .divider::after {
            right: 0;
        }
        .social-buttons {
            display: flex;
            gap: 10px;
        }
        .social-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .social-btn:hover {
            background: rgba(148, 163, 184, 0.1);
            color: #e2e8f0;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            display: block;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            display: block;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 14px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            color: #64748b;
            font-size: 13px;
        }
        .avatar-section {
            text-align: center;
            margin-bottom: 20px;
        }
        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .avatar-preview:hover {
            transform: scale(1.05);
        }
        .avatar-btn {
            padding: 8px 20px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            border-radius: 8px;
            color: #60a5fa;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            margin-top: 10px;
        }
        .avatar-btn:hover {
            background: rgba(59, 130, 246, 0.3);
        }
        #avatar-upload {
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-section">
            <div class="logo">💻</div>
            <div class="title">GIT Glow</div>
            <div class="subtitle">信息技术研创社</div>
        </div>

        <div class="tabs">
            <div class="tab active" id="login-tab" onclick="switchTab('login')">登录</div>
            <div class="tab inactive" id="register-tab" onclick="switchTab('register')">注册</div>
        </div>

        <!-- 登录表单 -->
        <div id="login-form">
            <div class="message" id="login-message"></div>
            <div class="form-group">
                <label for="login-email">邮箱</label>
                <input type="email" id="login-email" placeholder="请输入邮箱地址">
            </div>
            <div class="form-group">
                <label for="login-password">密码</label>
                <input type="password" id="login-password" placeholder="请输入密码">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">记住我</label>
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">登录</button>
            <div class="links">
                <a href="#" onclick="showForgotPassword()">忘记密码？</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="register-form" style="display: none;">
            <div class="message" id="register-message"></div>
            <div class="avatar-section">
                <img id="register-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="头像" class="avatar-preview" onclick="changeAvatar()">
                <br>
                <button class="avatar-btn" onclick="changeAvatar()">选择头像</button>
            </div>
            <div class="form-group">
                <label for="register-username">用户名</label>
                <input type="text" id="register-username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="register-email">邮箱</label>
                <input type="email" id="register-email" placeholder="请输入邮箱地址">
            </div>
            <div class="form-group">
                <label for="register-password">密码</label>
                <input type="password" id="register-password" placeholder="请输入密码（至少6位）">
            </div>
            <div class="form-group">
                <label for="register-confirm">确认密码</label>
                <input type="password" id="register-confirm" placeholder="请再次输入密码">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="agree-terms">
                <label for="agree-terms">我已阅读并同意<a href="#" style="color:#60a5fa;">用户协议</a>和<a href="#" style="color:#60a5fa;">隐私政策</a></label>
            </div>
            <button class="btn btn-primary" onclick="handleRegister()">注册</button>
        </div>

        <div class="divider">或</div>
        
        <input type="file" id="avatar-upload" accept="image/*" style="display:none;" onchange="uploadAvatar()">

        <div class="social-buttons">
            <button class="social-btn" onclick="loginWithGithub()">GitHub</button>
            <button class="social-btn" onclick="loginWithEmail()">邮箱登录</button>
        </div>

        <div class="footer">
            © 2026 GIT Glow信息技术研创社
        </div>
    </div>

    <script>
        var users = JSON.parse(localStorage.getItem('gitglow_users') || '[]');

        function switchTab(tab) {
            var loginTab = document.getElementById('login-tab');
            var registerTab = document.getElementById('register-tab');
            var loginForm = document.getElementById('login-form');
            var registerForm = document.getElementById('register-form');

            if(tab === 'login') {
                loginTab.className = 'tab active';
                registerTab.className = 'tab inactive';
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginTab.className = 'tab inactive';
                registerTab.className = 'tab active';
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        function showMessage(id, message, type) {
            var msg = document.getElementById(id);
            msg.textContent = message;
            msg.className = 'message ' + type;
            setTimeout(function() {
                msg.className = 'message';
            }, 3000);
        }

        function handleLogin() {
            var email = document.getElementById('login-email').value.trim();
            var password = document.getElementById('login-password').value;

            if(!email || !password) {
                showMessage('login-message', '请填写完整的登录信息', 'error');
                return;
            }

            var user = users.find(function(u) {
                return u.email === email && u.password === password;
            });

            if(user) {
                localStorage.setItem('gitglow_current_user', JSON.stringify(user));
                showMessage('login-message', '登录成功！正在跳转...', 'success');
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showMessage('login-message', '邮箱或密码错误', 'error');
            }
        }

        function handleRegister() {
            var username = document.getElementById('register-username').value.trim();
            var email = document.getElementById('register-email').value.trim();
            var password = document.getElementById('register-password').value;
            var confirm = document.getElementById('register-confirm').value;
            var agree = document.getElementById('agree-terms').checked;

            if(!username || !email || !password || !confirm) {
                showMessage('register-message', '请填写完整的注册信息', 'error');
                return;
            }

            if(password.length < 6) {
                showMessage('register-message', '密码至少需要6位', 'error');
                return;
            }

            if(password !== confirm) {
                showMessage('register-message', '两次输入的密码不一致', 'error');
                return;
            }

            if(!agree) {
                showMessage('register-message', '请先同意用户协议和隐私政策', 'error');
                return;
            }

            var exists = users.some(function(u) {
                return u.email === email || u.username === username;
            });

            if(exists) {
                showMessage('register-message', '用户名或邮箱已被注册', 'error');
                return;
            }

            var avatarData = document.getElementById('register-avatar').src;
            var newUser = {
                id: Date.now(),
                username: username,
                email: email,
                password: password,
                createdAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('gitglow_avatar_' + newUser.id, avatarData);
            localStorage.setItem('gitglow_users', JSON.stringify(users));
            
            showMessage('register-message', '注册成功！正在跳转登录...', 'success');
            setTimeout(function() {
                switchTab('login');
            }, 1500);
        }

        function loginWithGithub() {
            showMessage('login-message', 'GitHub登录功能开发中', 'error');
        }

        function loginWithEmail() {
            switchTab('login');
        }

        function showForgotPassword() {
            showMessage('login-message', '密码找回功能开发中', 'error');
        }

        function changeAvatar() {
            document.getElementById('avatar-upload').click();
        }

        function uploadAvatar() {
            var file = document.getElementById('avatar-upload').files[0];
            if(file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('register-avatar').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
